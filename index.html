<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>مُتابعة — دائرة المطابقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* Layout: deep-jade rail on the right (RTL) + airy work canvas; mobile = bottom tab bar.
   Palette: jade brand, coral spark, section hues (jade = labs, cobalt = quality), semantic status hues. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EDF2EF; --surface-3:#E3EAE6;
  --ink:#0E1B17; --ink-2:#4C5D57; --ink-3:#7E8F89; --line:#DCE5E0; --line-2:#C9D5CF;
  --brand:#0A8F6F; --brand-ink:#FFFFFF; --brand-soft:#DCF2EA; --brand-deep:#076B53;
  --spark:#FF6A4D; --spark-soft:#FFE7E1;
  --rail:#0B2620; --rail-2:#123A31; --rail-ink:#D9EDE6; --rail-mute:#7FA79B;
  --labs:#0A8F6F; --labs-soft:#DCF2EA; --quality:#3D5AFE; --quality-soft:#E3E8FF;
  --blue:#2F6BFF; --blue-soft:#E2EAFF; --amber:#D98A00; --amber-soft:#FFF1D6;
  --green:#16A34A; --green-soft:#DCF5E4; --red:#E0383E; --red-soft:#FDE3E4;
  --slate:#64748B; --slate-soft:#EBEFF3;
  --shadow:0 1px 2px rgba(14,27,23,.05),0 4px 14px rgba(14,27,23,.05);
  --shadow-lg:0 20px 50px rgba(14,27,23,.18);
  --f-display:"Alexandria","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A100E; --surface:#111917; --surface-2:#17221F; --surface-3:#1E2B27;
  --ink:#E7F1ED; --ink-2:#A3B6AF; --ink-3:#71857E; --line:#223029; --line-2:#2E3F38;
  --brand:#2CCB9C; --brand-ink:#04211A; --brand-soft:#0F2F26; --brand-deep:#6FE3BF;
  --spark:#FF7E63; --spark-soft:#3A1C15;
  --rail:#07130F; --rail-2:#0F2620; --rail-ink:#D9EDE6; --rail-mute:#6E9488;
  --labs:#2CCB9C; --labs-soft:#0F2F26; --quality:#7D93FF; --quality-soft:#1A2147;
  --blue:#6E9BFF; --blue-soft:#16234A; --amber:#F2B23A; --amber-soft:#3A2A0B;
  --green:#46D07A; --green-soft:#0F2E1C; --red:#FF6B70; --red-soft:#3D1416;
  --slate:#94A3B8; --slate-soft:#1C2630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A100E; --surface:#111917; --surface-2:#17221F; --surface-3:#1E2B27;
  --ink:#E7F1ED; --ink-2:#A3B6AF; --ink-3:#71857E; --line:#223029; --line-2:#2E3F38;
  --brand:#2CCB9C; --brand-ink:#04211A; --brand-soft:#0F2F26; --brand-deep:#6FE3BF;
  --spark:#FF7E63; --spark-soft:#3A1C15;
  --rail:#07130F; --rail-2:#0F2620; --rail-ink:#D9EDE6; --rail-mute:#6E9488;
  --labs:#2CCB9C; --labs-soft:#0F2F26; --quality:#7D93FF; --quality-soft:#1A2147;
  --blue:#6E9BFF; --blue-soft:#16234A; --amber:#F2B23A; --amber-soft:#3A2A0B;
  --green:#46D07A; --green-soft:#0F2E1C; --red:#FF6B70; --red-soft:#3D1416;
  --slate:#94A3B8; --slate-soft:#1C2630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:22px;height:22px}

/* ---------- shell ---------- */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 18px;padding-right:max(14px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.logo-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2CCB9C,#0A8F6F 60%,#076B53);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.logo-mark svg{width:24px;height:24px}
.logo b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.2}
.logo small{color:var(--rail-mute);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;color:var(--rail-mute);padding:14px 12px 6px;letter-spacing:.04em}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--rail-ink);opacity:.82;font-size:14px;transition:background .15s,opacity .15s}
.nav button:hover{background:var(--rail-2);opacity:1}
.nav button[aria-current="page"]{background:var(--rail-2);opacity:1;box-shadow:inset -3px 0 0 #2CCB9C}
.nav .count{margin-inline-start:auto;background:var(--spark);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;line-height:18px;font-weight:600}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--rail-2)}
.me-card .who{min-width:0}
.me-card b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card small{color:var(--rail-mute);font-size:11.5px}
.rail-actions{display:flex;gap:6px}
.rail-actions button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;color:var(--rail-mute);font-size:12.5px;border:1px solid var(--rail-2)}
.rail-actions button:hover{color:var(--rail-ink);background:var(--rail-2)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar h1{font-size:19px}
.topbar .crumb{color:var(--ink-3);font-size:12.5px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--spark-soft);color:var(--spark);font-size:12px;font-weight:500;white-space:nowrap}
.role-switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.spark{background:var(--spark);border-color:var(--spark);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.textarea{resize:vertical;min-height:88px;line-height:1.7}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:14px 55%,9px 55%;background-size:5px 5px;background-repeat:no-repeat;padding-left:28px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search .ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-right:36px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:20px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.t-slate{background:var(--slate-soft);color:var(--slate)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-green{background:var(--green-soft);color:var(--green)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-labs{background:var(--labs-soft);color:var(--labs)}
.t-quality{background:var(--quality-soft);color:var(--quality)}
.t-brand{background:var(--brand-soft);color:var(--brand)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none;font-family:var(--f-display)}
.avatar.sm{width:24px;height:24px;font-size:10.5px}
.avatar.lg{width:42px;height:42px;font-size:15px}

/* ---------- cards ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-head h3{font-size:15.5px}
.panel-head .sub{color:var(--ink-3);font-size:12.5px}
.panel-head .end{margin-inline-start:auto}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}

/* hero */
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero h2{font-size:clamp(22px,2.6vw,30px);font-weight:700}
.hero p{margin:4px 0 0;color:var(--ink-2)}
.hero .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

/* KPI */
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:start;transition:transform .15s,box-shadow .15s}
button.kpi{cursor:pointer}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .k-top{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px}
.kpi .k-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.kpi .k-val{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1}
.kpi .k-sub{color:var(--ink-3);font-size:12px}
.kpi.alert{border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.kpi.alert .k-val{color:var(--red)}

/* section cards */
.sec-card{display:flex;gap:18px;align-items:center}
.sec-card .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
.sec-card h4{font-size:15px;display:flex;align-items:center;gap:8px}
.sec-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.stat-row{display:flex;gap:18px;flex-wrap:wrap}
.stat-row div{display:flex;flex-direction:column}
.stat-row b{font-family:var(--f-display);font-size:19px}
.stat-row span{font-size:11.5px;color:var(--ink-3)}
.ring{flex:none}
.ring text{font-family:var(--f-display);font-weight:700}

/* lists */
.rows{display:flex;flex-direction:column}
.row{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-sub{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.flag{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* progress */
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:2px}
.tl-item{display:flex;gap:12px;padding:8px 0}
.tl-item .body{min-width:0;flex:1}
.tl-item .body p{margin:2px 0 0;color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.tl-item .when{font-size:11.5px;color:var(--ink-3)}

/* donut legend */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.legend div{display:flex;align-items:center;gap:10px;font-size:13px}
.legend b{margin-inline-start:auto;font-family:var(--f-display)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}

/* ---------- tasks ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 2px;font-weight:600;font-size:13.5px}
.col-head .n{margin-inline-start:auto;color:var(--ink-3);font-weight:500;font-family:var(--f-display)}
.tcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s,border-color .15s}
.tcard:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--line-2)}
.tcard .t-title{font-weight:500;line-height:1.55}
.tcard .t-top,.tcard .t-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tcard .t-foot{justify-content:space-between}
.tcard .topic{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;min-width:0}
.tcard .topic span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.due.late{color:var(--red);font-weight:500}
.due.soon{color:var(--amber);font-weight:500}
.empty-col{color:var(--ink-3);font-size:12.5px;text-align:center;padding:24px 8px;border:1px dashed var(--line-2);border-radius:var(--r)}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-weight:500;font-size:12px;color:var(--ink-3);text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cell-person{display:flex;align-items:center;gap:8px;white-space:nowrap}

/* topics */
.g-topics{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.topic-card{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,transform .15s}
.topic-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.topic-card h4{font-size:15.5px;line-height:1.5}
.topic-card .desc{color:var(--ink-2);font-size:13px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topic-card .foot{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.counts{display:flex;gap:14px}
.counts span{display:flex;align-items:center;gap:5px}

/* meetings */
.meeting{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.m-head{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.m-date{width:56px;flex:none;text-align:center;border-radius:12px;background:var(--brand-soft);color:var(--brand);padding:6px 0;font-family:var(--f-display)}
.m-date b{display:block;font-size:22px;line-height:1.1}
.m-date small{font-size:11px}
.m-date.up{background:var(--spark-soft);color:var(--spark)}
.m-main{flex:1;min-width:0}
.m-main h4{font-size:15px}
.m-main p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.m-body{border-top:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.m-body h5{margin:0 0 8px;font-size:13px;color:var(--ink-2);font-weight:500}
.m-body .minutes{margin:0;color:var(--ink-2);font-size:13.5px;white-space:pre-line}
.dec{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dec:last-child{border-bottom:0}
.dec .dec-n{width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none;margin-top:2px}
.dec .dec-main{flex:1;min-width:0}
.dec .dec-main p{margin:0}
.dec .dec-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:4px;align-items:center}

/* team */
.team-sec h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.g-team{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.member{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.member .m-top{display:flex;gap:12px;align-items:center}
.member .m-top div{min-width:0}
.member b{display:block}
.member small{color:var(--ink-3);font-size:12px}
.load{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}

/* settings */
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.steps code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;direction:ltr;unicode-bidi:embed}
.status-line{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,12,.45);z-index:70;animation:fade .18s ease}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(540px,100%);background:var(--surface);z-index:80;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.d-head{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:18px;line-height:1.5;flex:1}
.d-body{overflow-y:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:20px}
.d-chips{display:flex;gap:6px;flex-wrap:wrap}
.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.meta-grid .lbl{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.meta-grid .val{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.d-sec h5{margin:0 0 10px;font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.d-desc{margin:0;color:var(--ink-2);white-space:pre-line}
.range{width:100%;accent-color:var(--brand)}
.status-btns{display:flex;gap:6px;flex-wrap:wrap}
.status-btns button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;border:1px solid var(--line-2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.status-btns button[aria-pressed="true"]{border-color:currentColor}
.status-btns button:disabled{opacity:.4;cursor:not-allowed}
.composer{display:flex;flex-direction:column;gap:8px}
.composer .row-end{display:flex;justify-content:flex-end}
.approve-box{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:var(--amber);flex-wrap:wrap}
.approve-box p{margin:0;flex:1;min-width:160px;font-weight:500}

.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal-card .d-head{border-bottom:1px solid var(--line)}
.form{padding:18px 22px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.hint{font-size:12px;color:var(--ink-3)}

.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(20px + env(safe-area-inset-left,0px));z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13.5px;animation:pop .2s ease}
.toast.err{background:var(--red);color:#fff}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:var(--rail);color:var(--rail-ink);position:relative;overflow:hidden;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.login-art > *:not(canvas){position:relative}
.login-art h1{font-size:clamp(34px,4.4vw,56px);line-height:1.15;font-weight:700;color:#fff}
.login-art h1 em{font-style:normal;color:#2CCB9C}
.login-art p{color:var(--rail-mute);max-width:440px;margin:14px 0 0;font-size:15px}
.login-feats{display:flex;gap:10px;flex-wrap:wrap}
.login-feats span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:13px}
.login-form{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));max-width:520px;width:100%;margin:0 auto}
.login-form h2{font-size:24px}
.login-form .lead{color:var(--ink-2);margin:6px 0 0}
.role-cards{display:flex;flex-direction:column;gap:10px}
.role-card{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s}
.role-card:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);transform:translateY(-1px)}
.role-card .rc-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.role-card div{min-width:0;flex:1}
.role-card b{display:block;font-size:15px}
.role-card small{color:var(--ink-3);font-size:12.5px}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:.2;transform:translateY(16px)}}
@keyframes draw{from{stroke-dashoffset:var(--c)}}
@keyframes spin-in{from{transform:rotate(-140deg) scale(.82);opacity:.3}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes float-x{50%{transform:translate(-6px,-6px) rotate(-1.5deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes tick{0%{stroke-dashoffset:34}25%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes drift{to{transform:translate(7%,-5%) rotate(10deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes sheen{from{transform:translateX(120%)}to{transform:translateX(-120%)}}
.anim > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.anim > *:nth-child(2){animation-delay:.07s}.anim > *:nth-child(3){animation-delay:.14s}.anim > *:nth-child(4){animation-delay:.21s}.anim > *:nth-child(5){animation-delay:.28s}.anim > *:nth-child(n+6){animation-delay:.34s}
.anim .g-kpi > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.anim .g-kpi > *:nth-child(2){animation-delay:.12s}.anim .g-kpi > *:nth-child(3){animation-delay:.19s}.anim .g-kpi > *:nth-child(4){animation-delay:.26s}
.anim .g-topics > *,.anim .g-team > *,.anim .board .tcard{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.anim .g-topics > *:nth-child(2),.anim .g-team > *:nth-child(2){animation-delay:.06s}
.anim .g-topics > *:nth-child(3),.anim .g-team > *:nth-child(3){animation-delay:.12s}
.anim .g-topics > *:nth-child(n+4),.anim .g-team > *:nth-child(n+4){animation-delay:.18s}
.anim .ring .arc{animation:draw 1.3s cubic-bezier(.3,.7,.2,1) .25s both}
.anim .donut-svg{animation:spin-in 1s cubic-bezier(.2,.8,.2,1) .15s both;transform-origin:50% 50%}
.anim .chart .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.anim .bar i{transform-origin:right center;animation:fill 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
.kpi.alert .k-ico{animation:pulse 1.8s ease-out infinite}
.kpi .k-ico .ico{transition:transform .25s}
button.kpi:hover .k-ico .ico{transform:scale(1.15) rotate(-6deg)}
.nav button .ico{transition:transform .2s}
.nav button:hover .ico{transform:translateX(-3px)}
.btn.primary,.btn.spark{position:relative;overflow:hidden}
.btn.primary::after,.btn.spark::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(120%);pointer-events:none}
.btn.primary:hover::after,.btn.spark:hover::after{animation:sheen .8s ease}
.logo-mark{transition:transform .3s}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.05)}

/* hero banner */
.hero-banner{position:relative;overflow:hidden;isolation:isolate;border-radius:22px;background:linear-gradient(135deg,#0B2620 0%,#0E3029 55%,#14294A 100%);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -22px rgba(7,40,33,.6);color:var(--rail-ink);padding:26px 30px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.hero-banner::before{content:"";position:absolute;inset:-45%;z-index:-1;background:
  radial-gradient(closest-side,rgba(44,203,156,.42),transparent 72%) 22% 32%/52% 52% no-repeat,
  radial-gradient(closest-side,rgba(61,90,254,.34),transparent 72%) 78% 68%/48% 48% no-repeat,
  radial-gradient(closest-side,rgba(255,106,77,.26),transparent 72%) 58% 12%/38% 38% no-repeat;animation:drift 16s ease-in-out infinite alternate}
.hero-banner::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:18px 18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.hero-text{flex:1;min-width:min(260px,100%);display:flex;flex-direction:column;gap:6px}
.hero-text .eyebrow{font-size:12.5px;color:var(--rail-mute);display:flex;align-items:center;gap:8px}
.hero-text h2{color:#fff;font-size:clamp(23px,2.8vw,32px);font-weight:700}
.hero-text p{margin:0;color:var(--rail-mute);max-width:52ch}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.glass{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.15)}
.hero-art{width:270px;max-width:100%;flex:none;margin-inline-start:auto}
.hero-art svg{width:100%;height:auto;display:block;overflow:visible}
.fl{transform-box:fill-box;animation:float 6s ease-in-out infinite}
.fl.d1{animation-delay:-1.5s}.fl.d2{animation-delay:-3s}.fl.d3{animation-delay:-4.5s}
.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.sp.d1{animation-delay:-.8s}.sp.d2{animation-delay:-1.6s}
.tk{stroke-dasharray:34;animation:tick 3.4s ease-in-out infinite}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 16px;color:var(--ink-2)}
.empty svg{width:150px;height:108px;overflow:visible}
.empty b{font-family:var(--f-display);font-size:15px;color:var(--ink)}
.empty p{margin:0;font-size:13px;color:var(--ink-3);max-width:40ch}
.empty .btn{margin-top:6px}

/* login extras */
.float-cards{position:relative;height:150px;max-width:460px}
.fcard{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:float-x 7s ease-in-out infinite}
.fcard .fi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.fcard small{display:block;color:var(--rail-mute);font-size:11px}
.fcard.c1{top:0;right:0}.fcard.c2{top:52px;right:150px;animation-delay:-2.3s}.fcard.c3{top:104px;right:30px;animation-delay:-4.6s}
.fbar{width:90px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.fbar i{display:block;height:100%;width:75%;background:#2CCB9C;border-radius:9px;transform-origin:right;animation:fill 2.4s cubic-bezier(.2,.8,.2,1) infinite alternate}

/* login feedback */
.login-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--red-soft);color:var(--red);font-weight:500;font-size:13.5px;line-height:1.6;border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}
.login-alert .ico{margin-top:2px}
.input.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.85;cursor:progress}

.ok-alert{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)}

.link-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--brand);font-size:13px;font-weight:500;padding:4px 2px;border-radius:6px}
.link-btn:hover{text-decoration:underline}
.link-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* credit */
.credit{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;padding-top:16px;margin-top:6px;border-top:1px solid var(--line);text-align:center}
.credit b{color:var(--ink);font-weight:600;font-family:var(--f-display)}
.credit .dot-sep{width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.credit .sig{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.login-form .credit{border-top:0;padding-top:24px}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .float-cards{display:none}
  .hero-art{width:200px;margin-inline:auto}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);padding:4px 6px;border-radius:8px;flex:1}
  .tabbar button[aria-current="page"]{color:var(--brand)}
  .content{padding-bottom:96px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .m-body{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{padding:32px 24px;min-height:300px}
  .topbar .crumb{display:none}
}
@media (max-width:560px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}.kpi .k-val{font-size:26px}
  .form{grid-template-columns:minmax(0,1fr)}
  .meta-grid{grid-template-columns:minmax(0,1fr)}
  .sec-card{flex-direction:column;align-items:stretch}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .role-switch span{display:none}
  .search{max-width:none}
}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(-24px);opacity:0}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.login,.shell{min-height:100vh;min-height:100dvh}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}

/* ---------------- dictionaries ---------------- */
const STATUS = {
  new:{label:'جديدة', tone:'slate', color:'var(--slate)'},
  progress:{label:'قيد التنفيذ', tone:'blue', color:'var(--blue)'},
  review:{label:'بانتظار الاعتماد', tone:'amber', color:'var(--amber)'},
  done:{label:'مكتملة', tone:'green', color:'var(--green)'}
};
const PRIORITY = {
  high:{label:'عالية', tone:'red', color:'var(--red)'},
  medium:{label:'متوسطة', tone:'amber', color:'var(--amber)'},
  low:{label:'منخفضة', tone:'slate', color:'var(--slate)'}
};
const ROLE = {director:'مدير الدائرة', head:'رئيس قسم', staff:'موظف'};
const SEC_META = {
  labs:{icon:'flask', tone:'labs', color:'var(--labs)'},
  quality:{icon:'badge', tone:'quality', color:'var(--quality)'}
};
const AV_COLORS = ['#0A8F6F','#3D5AFE','#FF6A4D','#D98A00','#8B5CF6','#0EA5E9','#DB2777','#16A34A'];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const isoDay = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0,10); };
const parseDay = s => { if(!s) return null; const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const daysUntil = s => { const d = parseDay(s); return d ? Math.round((d - today0())/DAY) : null; };
const LOC = 'ar-OM-u-nu-latn';
const fmtDate = s => s ? parseDay(s).toLocaleDateString(LOC, {day:'numeric', month:'short'}) : '—';
const fmtDateLong = s => s ? parseDay(s).toLocaleDateString(LOC, {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '—';
function ago(ts){
  const m = Math.round((Date.now() - new Date(ts).getTime())/6e4);
  if (m < 1) return 'الآن';
  if (m < 60) return `قبل ${m} دقيقة`;
  const h = Math.round(m/60); if (h < 24) return `قبل ${h} ساعة`;
  const d = Math.round(h/24); if (d === 1) return 'أمس';
  if (d < 30) return `قبل ${d} يوم`;
  return new Date(ts).toLocaleDateString(LOC, {day:'numeric', month:'short'});
}
function initials(name){
  const p = String(name||'؟').replace(/^(د\.|م\.|أ\.)\s*/,'').trim().split(/\s+/);
  return (p[0]?.[0]||'') + (p[1]?.[0]||'');
}
function avColor(id){ let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0))>>>0; return AV_COLORS[h % AV_COLORS.length]; }
const avatar = (p, cls='') => p ? `<span class="avatar ${cls}" style="background:${avColor(p.id)}" title="${esc(p.full_name)}">${esc(initials(p.full_name))}</span>` : `<span class="avatar ${cls}" style="background:var(--ink-3)">—</span>`;
const chip = (label, tone, dot=false) => `<span class="chip t-${tone}">${dot?'<span class="dot"></span>':''}${esc(label)}</span>`;
const statusChip = s => chip(STATUS[s]?.label||s, STATUS[s]?.tone||'slate', true);
const prioChip = p => chip(PRIORITY[p]?.label||p, PRIORITY[p]?.tone||'slate');
const secChip = id => { const s = sec(id); return s ? `<span class="chip t-${SEC_META[id]?.tone||'brand'}">${ico(SEC_META[id]?.icon||'folder','sm')}${esc(s.short||s.name)}</span>` : ''; };
const isLate = t => t.status !== 'done' && t.due_date && daysUntil(t.due_date) < 0;
function dueChip(t){
  if (!t.due_date) return '';
  const n = daysUntil(t.due_date);
  if (t.status === 'done') return `<span class="due">${ico('check','sm')}${fmtDate(t.due_date)}</span>`;
  if (n < 0) return `<span class="due late">${ico('alert','sm')}متأخرة ${-n} يوم</span>`;
  if (n === 0) return `<span class="due soon">${ico('clock','sm')}اليوم</span>`;
  if (n <= 3) return `<span class="due soon">${ico('clock','sm')}بعد ${n} يوم</span>`;
  return `<span class="due">${ico('cal','sm')}${fmtDate(t.due_date)}</span>`;
}
function toast(msg, err=false){
  const el = document.createElement('div');
  el.className = 'toast' + (err?' err':'');
  el.innerHTML = (err?ico('alert'):ico('check')) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

/* ---------------- data layer: Supabase ---------------- */
const SupaDB = {
  sb:null,
  async init(){
    await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = SUPABASE_JS; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  },
  chk({data, error}){ if (error) throw error; return data; },
  async session(){ const {data} = await this.sb.auth.getSession(); return data.session; },
  async signIn(email, password){ this.chk(await this.sb.auth.signInWithPassword({email, password})); },
  async signOut(){ await this.sb.auth.signOut(); },
  async changePassword(pw){ this.chk(await this.sb.auth.updateUser({password:pw})); },
  async resetPassword(email){ this.chk(await this.sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname})); },
  async load(){
    const q = (t, o) => this.sb.from(t).select('*').order(o.col, {ascending:o.asc}).limit(o.limit||2000);
    const [sections, profiles, topics, tasks, updates, meetings, decisions] = await Promise.all([
      q('sections',{col:'id',asc:true}), q('profiles',{col:'full_name',asc:true}), q('topics',{col:'id',asc:true}),
      q('tasks',{col:'id',asc:true}), q('task_updates',{col:'created_at',asc:false,limit:500}),
      q('meetings',{col:'meeting_date',asc:false}), q('decisions',{col:'id',asc:true})
    ]).then(rs => rs.map(r => this.chk(r)));
    return {sections, profiles, topics, tasks, updates, meetings, decisions};
  },
  async createTask(t){ return this.chk(await this.sb.from('tasks').insert(t).select().single()); },
  async updateTask(id, patch){ this.chk(await this.sb.from('tasks').update(patch).eq('id', id)); },
  async deleteTask(id){ this.chk(await this.sb.from('tasks').delete().eq('id', id)); },
  async addUpdate(u){ this.chk(await this.sb.from('task_updates').insert(u)); },
  async createTopic(t){ this.chk(await this.sb.from('topics').insert(t)); },
  async createMeeting(m, decs){
    const row = this.chk(await this.sb.from('meetings').insert(m).select().single());
    if (decs.length) this.chk(await this.sb.from('decisions').insert(decs.map(x => ({...x, meeting_id:row.id}))));
  },
  async updateDecision(id, patch){ this.chk(await this.sb.from('decisions').update(patch).eq('id', id)); },
  async updateProfile(id, patch){ this.chk(await this.sb.from('profiles').update(patch).eq('id', id)); }
};

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const DB = SupaDB;
const S = {

};
const sec = id => S.data?.sections.find(s => s.id === id);
const person = id => S.data?.profiles.find(p => p.id === id);
const topic = id => S.data?.topics.find(t => t.id === id);
const me = () => S.me;
const isDir = () => me()?.role === 'director';
const isHead = () => me()?.role === 'head';

/* permissions — mirror of the database RLS rules */
function canSee(t){ const m = me(); if (!m) return false; if (m.role === 'director') return true; if (m.role === 'head') return t.section_id === m.section_id; return t.assignee_id === m.id; }
function canManage(t){ const m = me(); return m.role === 'director' || (m.role === 'head' && t.section_id === m.section_id); }
const canCreate = () => isDir() || isHead();
function visibleTasks(){ return S.data.tasks.filter(canSee); }
function visibleTopics(){ const m = me(); return S.data.topics.filter(t => m.role === 'director' || t.section_id === m.section_id); }
function visibleSections(){ const m = me(); return m.role === 'director' ? S.data.sections : S.data.sections.filter(s => s.id === m.section_id); }

/* ---------------- boot ---------------- */
async function boot(){
  applyTheme(store.get('motabaa-theme') || 'system');
  try {
    if (!LIVE){ renderNotConnected(); return; }
    const h = location.hash, isRecovery = /type=recovery/.test(h), linkError = /error_code=|error=access_denied/.test(h);
    await DB.init();
    const ses = await DB.session();
    if (isRecovery || linkError) history.replaceState(null, '', location.pathname + location.search);
    if (isRecovery && ses){ S.me = null; renderLogin('newpw'); return; }
    if (ses){ await enterLive(ses.user.id); return; }
    S.me = null; renderLogin();
    if (linkError) setTimeout(() => showLoginError('رابط تعيين كلمة المرور غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من «نسيت كلمة المرور؟».'), 50);
  } catch (e){
    console.error(e);
    $('#app').innerHTML = `<div class="content"><div class="panel"><h3>تعذّر الاتصال بقاعدة البيانات</h3><p class="hint">${esc(e.message||e)}</p></div></div>`;
  }
}
async function enterLive(uid){
  S.data = await DB.load();
  S.me = person(uid); S.anim = true;
  S.view = 'dashboard'; S.openTask = null; S.modal = null; S.armDelete = false;
  S.f = {q:'', section:'all', priority:'all', status:'all', topic:'all', who:'all'};
  if (!S.me || !(S.me.role === 'director' || S.me.section_id)){ await DB.signOut(); S.me = null; renderLogin(); setTimeout(() => showLoginError('حسابك لم يُفعّل بعد. تواصل مع مسؤولة النظام لتحديد دورك وقسمك.'), 50); return; }
  render();
}
async function refresh(){ S.data = await DB.load(); if (LIVE) S.me = person(S.me.id); render(); }

/* ---------------- theme ---------------- */
function applyTheme(t){
  const r = document.documentElement;
  if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  store.set('motabaa-theme', t);
}
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

function busy(btn, text){ const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${text}`; return () => { btn.disabled = false; btn.innerHTML = label; }; }
function bindLogin(mode){
  const em = $('#lg-email'); if (em) em.addEventListener('input', () => { S.lastEmail = em.value.trim(); hideLoginError(); });
  $('#lg-pass')?.addEventListener('input', hideLoginError);
  $('#forgotBtn')?.addEventListener('click', () => { S.lastEmail = $('#lg-email').value.trim(); renderLogin('forgot'); $('#lg-email')?.focus(); });
  $('#backLogin')?.addEventListener('click', () => renderLogin('login'));
  if (mode === 'forgot') $('#forgotForm').addEventListener('submit', async e => {
    e.preventDefault();
    const done = busy(e.target.querySelector('button[type="submit"]'), 'جارٍ الإرسال…');
    hideLoginError(); $('#fp-ok').hidden = true;
    try { await DB.resetPassword($('#lg-email').value.trim()); $('#fp-ok').hidden = false; }
    catch (err){
      const m = String(err?.message||'').toLowerCase(), st = err?.status;
      showLoginError(st === 429 || m.includes('rate') || m.includes('seconds') ? 'تم إرسال طلبات كثيرة. انتظر دقيقة ثم حاول مرة أخرى.'
        : m.includes('fetch') || m.includes('network') ? 'تعذّر الاتصال بالخادم. تحقق من اتصال الإنترنت وحاول مرة أخرى.'
        : 'تعذّر إرسال الرسالة حاليًا. تواصل مع مسؤولة النظام لإعادة تعيين كلمة المرور.');
    }
    finally { done(); }
  });
  if (mode === 'newpw') $('#newpwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('#np1').value, b = $('#np2').value;
    hideLoginError();
    if (a.length < 8) return showLoginError('كلمة المرور يجب أن تكون 8 أحرف على الأقل.');
    if (a !== b) return showLoginError('كلمتا المرور غير متطابقتين. أعد كتابتهما بنفس الشكل.');
    const done = busy(e.target.querySelector('button[type="submit"]'), 'جارٍ الحفظ…');
    try {
      await DB.changePassword(a); $('#np-ok').hidden = false;
      const s = await DB.session(); setTimeout(() => enterLive(s.user.id).catch(() => renderLogin()), 1200);
    } catch (err){
      done(); const m = String(err?.message||'').toLowerCase();
      showLoginError(m.includes('different') || m.includes('same') ? 'كلمة المرور الجديدة يجب أن تختلف عن السابقة.'
        : m.includes('session') || m.includes('expired') || m.includes('jwt') ? 'انتهت صلاحية الرابط. اطلب رابطًا جديدًا من «نسيت كلمة المرور؟».'
        : 'تعذّر حفظ كلمة المرور. حاول مرة أخرى.');
    }
  });
  ['#np1','#np2'].forEach(id => $(id)?.addEventListener('input', hideLoginError));
}

function loginMsg(err){
  const m = String(err?.message || '').toLowerCase(), st = err?.status;

  if (m.includes('failed to fetch') || m.includes('network') || m.includes('load failed')) return 'تعذّر الاتصال بالخادم. تحقق من اتصال الإنترنت وحاول مرة أخرى.';
  return 'البريد الإلكتروني أو كلمة المرور غير صحيحة. تأكد منهما وحاول مرة أخرى.';
}
function showLoginError(msg){
  const a = $('#lg-alert'); if (!a) return;
  $('#lg-err').textContent = msg; a.hidden = false;
  ['#lg-email','#lg-pass'].forEach(id => $(id)?.classList.add('bad'));

function drawArt(){
  cancelAnimationFrame(artRAF);
  const c = $('#art'); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio||1, 2);
  c.width = r.width*dpr; c.height = r.height*dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#2CCB9C','#3D5AFE','#FF6A4D','#F2B23A'];
  const step = 34;
  const frame = t => {
    if (!c.isConnected) return;
    g.clearRect(0, 0, r.width, r.height);
    const k = t * 0.00035;
    for (let y = step/2; y < r.height; y += step){
      for (let x = step/2; x < r.width; x += step){
        const n = Math.sin(x*0.013 + y*0.021 + k*2) + Math.cos(y*0.017 - x*0.009 - k*1.4);
        const a = Math.max(0, n) * 0.5;
        g.globalAlpha = 0.07 + a*0.5;
        g.fillStyle = n > 1.25 ? cols[(Math.floor(x/step)+Math.floor(y/step)) % cols.length] : '#2CCB9C';
        const sz = 3 + a*5;
        g.beginPath(); g.roundRect ? g.roundRect(x - sz/2, y - sz/2, sz, sz, 2) : g.rect(x - sz/2, y - sz/2, sz, sz); g.fill();
      }
    }
    if (!REDUCED()) artRAF = requestAnimationFrame(frame);
  };
  frame(0);
}

function countUp(){

}

    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="var(--ink)" font-size="${size*0.22}">${pct}%</text></svg>`;
}
function statsOf(tasks){
  const open = tasks.filter(t => t.status !== 'done');
  const done = tasks.filter(t => t.status === 'done');
  return {
    total:tasks.length, open:open.length, done:done.length,
    late:tasks.filter(isLate).length,
    review:tasks.filter(t => t.status === 'review').length,
    week:open.filter(t => { const n = daysUntil(t.due_date); return n !== null && n >= 0 && n <= 7; }).length,
    rate: tasks.length ? Math.round(done.length / tasks.length * 100) : 0

function donut(tasks){
  const order = ['new','progress','review','done'];
  const counts = order.map(s => tasks.filter(t => t.status === s).length);
  const total = counts.reduce((a,b) => a+b, 0) || 1;
  const size = 150, r = 56, c = 2*Math.PI*r;
  let acc = 0;
  const arcs = order.map((s,i) => { const len = counts[i]/total*c; const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${STATUS[s].color}" stroke-width="20" stroke-dasharray="${Math.max(0,len-2).toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`; acc += len; return counts[i] ? seg : ''; }).join('');
  return `<div class="donut-wrap">
    <svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="توزيع المهام حسب الحالة">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="20"/>${arcs}
      <text x="50%" y="46%" text-anchor="middle" fill="var(--ink)" font-family="Alexandria, sans-serif" font-weight="700" font-size="28">${tasks.length}</text>
      <text x="50%" y="62%" text-anchor="middle" fill="var(--ink-3)" font-size="11">مهمة</text>
    </svg>
    <div class="legend">${order.map((s,i) => `<div><span class="sw" style="background:${STATUS[s].color}"></span>${STATUS[s].label}<b class="num">${counts[i]}</b></div>`).join('')}</div>
  </div>`;
}
function weeklyChart(tasks){
  const W = 8, now = today0().getTime();
  const weeks = Array.from({length:W}, (_,i) => ({start: now - (W-1-i)*7*DAY - 6*DAY, end: now - (W-1-i)*7*DAY + DAY, n:0}));
  tasks.filter(t => t.closed_at).forEach(t => { const x = new Date(t.closed_at).getTime(); const w = weeks.find(w => x >= w.start && x < w.end); if (w) w.n++; });
  const max = Math.max(3, ...weeks.map(w => w.n));
  const ticks = max <= 4 ? [0,2,4] : [0, Math.ceil(max/2), max];
  const top = Math.max(...ticks);
  const vw = 560, vh = 200, pl = 34, pr = 10, pt = 14, pb = 30;
  const iw = vw - pl - pr, ih = vh - pt - pb, bw = iw/W*0.52;
  const y = v => pt + ih - v/top*ih;
  const grid = ticks.map(v => `<line x1="${pl}" x2="${vw-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v?'3 4':'0'}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const bars = weeks.map((w,i) => {
    const cx = pl + iw/W*(i+.5); const h = ih - (y(w.n) - pt);
    const last = i === W-1;
    const ld = new Date(w.end - DAY); const lbl = `${ld.getDate()}/${ld.getMonth()+1}`;
    return `<rect class="b" style="animation-delay:${(i*0.06).toFixed(2)}s" x="${cx-bw/2}" y="${y(w.n)}" width="${bw}" height="${Math.max(h,0)}" rx="6" fill="${last?'var(--spark)':'var(--brand)'}" opacity="${last?1:.85}"/>
      ${w.n?`<text x="${cx}" y="${y(w.n)-5}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${w.n}</text>`:''}
      <text x="${cx}" y="${vh-10}" text-anchor="middle">${lbl}</text>`;
  }).join('');
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${vw} ${vh}" width="100%" style="min-width:420px;direction:ltr" role="img" aria-label="عدد المهام المنجزة أسبوعيًا">${grid}${bars}</svg></div>`;
}
function topicStats(tp){
  const ts = S.data.tasks.filter(t => t.topic_id === tp.id && canSee(t));
  const all = S.data.tasks.filter(t => t.topic_id === tp.id);
  const base = isDir() || isHead() ? all : ts;
  const pct = base.length ? Math.round(base.reduce((s,t) => s + (t.status==='done'?100:(t.progress||0)), 0) / base.length) : 0;
  return {total:base.length, done:base.filter(t => t.status==='done').length, late:base.filter(isLate).length, pct};
}

function filteredTasks(){
  const f = S.f, q = f.q.trim();
  return visibleTasks().filter(t => {
    if (f.section !== 'all' && t.section_id !== f.section) return false;
    if (f.priority !== 'all' && t.priority !== f.priority) return false;
    if (f.topic !== 'all' && String(t.topic_id) !== f.topic) return false;
    if (f.who !== 'all' && t.assignee_id !== f.who) return false;
    if (f.status === 'late' && !isLate(t)) return false;
    if (f.status === 'open' && t.status === 'done') return false;
    if (f.status === 'week'){ const n = daysUntil(t.due_date); if (t.status === 'done' || n === null || n < 0 || n > 7) return false; }
    if (STATUS[f.status] && t.status !== f.status) return false;
    if (q && !(t.title.includes(q) || (t.description||'').includes(q) || (person(t.assignee_id)?.full_name||'').includes(q))) return false;
    return true;
  });
}

      await DB.updateTask(t.id, patch);
      await DB.addUpdate({task_id:t.id, author_id:me().id, body:'', new_status:st});
    }, `أصبحت الحالة: ${STATUS[st].label}`);
  });
  const ap = document.querySelector('[data-act="approve"]');
  if (ap) ap.onclick = () => act(async () => { await DB.updateTask(t.id, {status:'done', progress:100, closed_at:new Date().toISOString()}); await DB.addUpdate({task_id:t.id, author_id:me().id, body:'تم اعتماد الإنجاز.', new_status:'done'}); }, 'تم اعتماد المهمة');
  const rj = document.querySelector('[data-act="reject"]');
  if (rj) rj.onclick = () => { const note = $('#upd')?.value.trim(); act(async () => { await DB.updateTask(t.id, {status:'progress', progress:Math.min(t.progress, 90)}); await DB.addUpdate({task_id:t.id, author_id:me().id, body: note || 'أُعيدت المهمة للتنفيذ لاستكمال الملاحظات.', new_status:'progress'}); }, 'أُعيدت المهمة للتنفيذ'); };
  const po = document.querySelector('[data-act="post"]');
  if (po) po.onclick = () => { const v = $('#upd').value.trim(); if (!v){ $('#upd').focus(); return; } act(async () => DB.addUpdate({task_id:t.id, author_id:me().id, body:v}), 'تمت إضافة التحديث'); };
  const ed = document.querySelector('[data-act="editTask"]');
  if (ed) ed.onclick = () => openModal({type:'task', task:t});
  const del = document.querySelector('[data-act="del"]');
  if (del) del.onclick = () => {
    if (!S.armDelete){ S.armDelete = true; render(); return; }
    act(async () => { await DB.deleteTask(t.id); S.openTask = null; S.armDelete = false; }, 'تم حذف المهمة');
  };
}
async function act(fn, ok){
  try { await fn(); await refresh(); if (ok) toast(ok); }
  catch (e){ console.error(e); toast('تعذّر الحفظ: ' + (e.message || 'تحقق من الصلاحيات أو الاتصال'), true); }
}

    if (!v('m-title')){ $('#m-title').focus(); return; }
    if (m.type === 'task'){
      const row = {title:v('m-title'), description:v('m-desc')||'', section_id:v('m-sec'), assignee_id:v('m-ass'), priority:v('m-prio'), due_date:v('m-due')||null, topic_id: v('m-topic') ? +v('m-topic') : null};
      act(async () => {
        if (m.task) await DB.updateTask(m.task.id, row);
        else {
          const created = await DB.createTask({...row, assigned_by:me().id, status:'new', progress:0});
          if (m.fromDecision && created) await DB.updateDecision(m.fromDecision.id, {task_id:created.id});
        }
        S.modal = null;
      }, m.task ? 'تم حفظ التعديلات' : 'تمت إحالة المهمة');
    } else if (m.type === 'topic'){
      act(async () => { await DB.createTopic({title:v('m-title'), description:v('m-desc')||'', section_id:v('m-sec'), owner_id:v('m-owner'), priority:v('m-prio'), status:'active', target_date:v('m-due')||null}); S.modal = null; }, 'تمت إضافة الموضوع');
    } else if (m.type === 'meeting'){
      const decs = ($('#m-decs').value||'').split('\n').map(s => s.trim()).filter(Boolean).map(body => ({body, owner_id:null, due_date:null, task_id:null}));
      act(async () => { await DB.createMeeting({title:v('m-title'), meeting_date:v('m-date'), attendees:v('m-att')||'', minutes:$('#m-min').value.trim()}, decs); S.modal = null; S.openMeeting = null; }, 'تم تسجيل الاجتماع');
    }
  };
}

var VIEWS, AFTER;
boot();
</script>
</body>
</html>
